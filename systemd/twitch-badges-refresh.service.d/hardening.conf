[Service]
# Зависший прогон (SD отвечает медленно/rsync висит) → SIGTERM через 10 мин →
# юнит failed → таймер штатно повторит через 30 мин, OnFailure-алерт сработает.
TimeoutStartSec=600
# Pillow-рендер + докачка картинок могут скакнуть по памяти — локальный предел,
# чтобы не утянуть весь VPS.
MemoryMax=512M
