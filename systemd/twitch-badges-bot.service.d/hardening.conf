[Unit]
# Латч отключён: systemd НИКОГДА не перестаёт перезапускать бот (напр. после
# временной недоступности Telegram/токена самолечится, когда всё вернётся).
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5
# Экспоненциальный backoff 5s→…→300s за 6 шагов: самолечится, но не молотит
# Telegram/CPU при устойчивой ошибке.
RestartSteps=6
RestartMaxDelaySec=300
# Утечка бота не должна съесть весь VPS: мягкий троттл + жёсткий предел, рецикл.
MemoryHigh=250M
MemoryMax=400M
OOMPolicy=stop
